<!DOCTYPE html>
<html>
<head>
  <title>FORMS</title>
  <link rel="stylesheet" href="styles/forms.css">
  <style>
    body { margin: 0; overflow: hidden; }
    .control-button {
      position: fixed;
      z-index: 100;
      padding: 8px 16px;
      margin: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      cursor: pointer;
    }
    #audio-start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #start-button {
      padding: 16px 32px;
      font-size: 1.2em;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid white;
      color: white;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
    }
    #start-button:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div id="error-message" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 8px; z-index: 1000;"></div>
  
  <div id="audio-start-overlay">
    <button id="start-button">Click to Start Experience</button>
  </div>

  <button id="fullscreenButton" class="control-button">Fullscreen</button>
  <button id="showcaseButton" class="control-button">Interactive Mode</button>
  <button id="backButton" class="control-button" onclick="window.location.href='projects'">Back to Projects</button>
  
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      console.error('Error: ', msg, 'URL: ', url, 'Line: ', lineNo, 'Column: ', columnNo, 'Error object: ', error);
      const errorDiv = document.getElementById('error-message');
      errorDiv.style.display = 'block';
      errorDiv.textContent = 'An error occurred while loading the application. Please check the console for details.';
      return false;
    };

    console.log('Document loading started');
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM fully loaded');
      
      const overlay = document.getElementById('audio-start-overlay');
      const startButton = document.getElementById('start-button');
      
      // Prevent initialization of Three.js scene until start button is clicked
      window.experienceStarted = false;
      
      startButton.addEventListener('click', async () => {
        console.log('Start button clicked');
        try {
          // Resume audio context
          if (Tone && Tone.context.state !== 'running') {
            await Tone.start();
            console.log('Tone.js context started');
          }
          
          // Set flag to allow scene initialization
          window.experienceStarted = true;
          
          // Hide overlay after successful audio start
          overlay.style.display = 'none';
          console.log('Audio experience started successfully');
        } catch (error) {
          console.error('Error starting audio:', error);
          document.getElementById('error-message').textContent = 'Failed to start audio. Please refresh and try again.';
          document.getElementById('error-message').style.display = 'block';
        }
      });
    });
  </script>

  <!-- Import map for ES modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
  
  <!-- Load Tone.js -->
  <script defer src="vendor/Tone.js"></script>
  
  <!-- Load main script -->
  <script type="module" src="js/forms/main.js"></script>
</body>
</html>
